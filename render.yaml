services:
  - type: web
    name: family-ledger-v1
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true # Render 將會自動為您產生一個隨機安全金鑰
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
    disk:
      name: ledger-data
      mountPath: /data
      sizeGB: 1
